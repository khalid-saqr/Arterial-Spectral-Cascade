[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arterial-spectral-cascade"
version = "0.3.0"
description = "Disease-resolved heterogeneous fractional-KdV solver for arterial spectral resonance and cascade studies"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Research software accompanying the 2026 Physics of Fluids study extension"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "tqdm>=4.65"
]

[project.optional-dependencies]
test = ["pytest>=7.4", "nbformat>=5.9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
